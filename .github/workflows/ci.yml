name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run for the same branch or PR when a new commit arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, type-check, test and build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # mongodb-memory-server downloads a MongoDB binary on first use; reuse it between runs
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage report
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Fails on high or critical advisories in the dependencies that ship to production
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t invoice-service:ci .

      - name: Start the image with MongoDB and wait until it is ready
        run: |
          docker network create ci
          docker run -d --name mongo --network ci mongo:8.2
          docker run -d --name app --network ci -p 3001:3001 \
            -e DATABASE_CONNECTION_STRING=mongodb://mongo:27017 \
            -e DATABASE_NAME=ci \
            -e API_KEYS="ci:read:$(printf 'ci-key' | sha256sum | cut -d' ' -f1)" \
            invoice-service:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/ready; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3001/ready
          curl -fsS -H "X-API-Key: ci-key" http://localhost:3001/api/v1/invoices

      - name: Show container logs
        if: always()
        run: docker logs app || true
